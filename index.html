<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>تست سرعت DNS | Game Renter</title>

<style>
:root{
  --bg1:#0f1226;
  --bg2:#0b1022;
  --card:#121a36;
  --txt:#e8ecff;
  --muted:#9aa4d6;
  --good:#2ee59d;
  --bad:#ff4d6d;
  --warn:#ffcc00;
  --accent:#7aa2ff;
  --radius:18px;
  --radius2:14px;
  --shadow:0 14px 40px rgba(0,0,0,.45);
  --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  --font: system-ui, -apple-system, Segoe UI, Roboto;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:var(--font);
  color:var(--txt);
  background:
    radial-gradient(700px 400px at 80% 0%, rgba(122,162,255,.18), transparent 60%),
    radial-gradient(600px 400px at 20% 0%, rgba(255,77,109,.14), transparent 60%),
    linear-gradient(180deg, var(--bg1), var(--bg2));
  min-height:100vh;
  padding:14px;
}

.app{
  max-width:420px;
  margin:0 auto;
  display:flex;
  flex-direction:column;
  gap:14px;
}

/* ---------- Header ---------- */
.header{
  background:linear-gradient(180deg, rgba(18,26,54,.85), rgba(18,26,54,.55));
  border-radius:var(--radius);
  padding:14px;
  box-shadow:var(--shadow);
}

.header h1{
  margin:0;
  font-size:15px;
  font-weight:900;
  text-align:right;
}

.header p{
  margin:6px 0 0;
  font-size:12px;
  color:var(--muted);
  line-height:1.6;
  text-align:right;
}

/* ---------- Card ---------- */
.card{
  background:linear-gradient(180deg, rgba(18,26,54,.8), rgba(18,26,54,.45));
  border-radius:var(--radius);
  padding:14px;
  box-shadow:var(--shadow);
}

/* ---------- Inputs ---------- */
.field{
  display:flex;
  flex-direction:column;
  gap:6px;
}

label{
  font-size:12px;
  color:var(--muted);
  text-align:right;
}

input{
  background:rgba(10,14,30,.6);
  border:1px solid rgba(255,255,255,.08);
  border-radius:14px;
  padding:12px;
  font-family:var(--mono);
  color:var(--txt);
  direction:ltr;
  text-align:left;
}

/* ---------- Buttons ---------- */
.buttons{
  display:flex;
  gap:8px;
  justify-content:flex-start; /* RTL = راست */
}

button{
  border-radius:999px;
  padding:10px 14px;
  border:none;
  font-size:13px;
  font-weight:800;
  cursor:pointer;
}

.btn-start{
  background:linear-gradient(135deg,#6ddcff,#ff6d8a);
  color:#08121e;
}

.btn-cancel{
  background:rgba(255,77,109,.15);
  color:#ffb3bf;
}

.btn-clear{
  background:transparent;
  color:var(--muted);
}

/* ---------- Suggested DNS ---------- */
.suggested{
  display:flex;
  flex-direction:column;
  gap:10px;
  margin-top:10px;
}

.suggested h3{
  margin:0;
  font-size:13px;
  color:var(--muted);
  text-align:right;
}

.dns-item{
  display:flex;
  align-items:center;
  justify-content:flex-start; /* RTL => راست */
  gap:10px;
  padding:10px 12px;
  border-radius:14px;
  background:rgba(15,20,50,.6);
  border:1px solid rgba(255,255,255,.06);
}

.dns-info{
  display:flex;
  flex-direction:column;
  gap:2px;
  text-align:right;
}

.dns-name{
  font-size:13px;
  font-weight:900;
}

.dns-ip{
  font-size:11px;
  font-family:var(--mono);
  color:var(--muted);
  direction:ltr;
  text-align:left;
}

.dns-actions{
  margin-right:auto; /* مهم: همه‌چیز مماس از راست */
  display:flex;
  gap:6px;
}

.dns-actions button{
  padding:6px 10px;
  font-size:11px;
  border-radius:999px;
}

/* ---------- Results ---------- */
.result{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.group{
  display:flex;
  align-items:center;
  justify-content:flex-start; /* RTL = راست */
  gap:10px;
  padding:10px;
  border-radius:14px;
  background:rgba(10,14,30,.55);
}

.group-title{
  font-size:13px;
  font-weight:900;
  text-align:right;
}

.group-ms{
  margin-right:auto;
  font-family:var(--mono);
  font-size:12px;
}

/* ---------- Status colors ---------- */
.good{color:var(--good)}
.bad{color:var(--bad)}
.warn{color:var(--warn)}

</style>
</head>

<body>
<div class="app">

  <div class="header">
    <h1>تست سرعت DNS برای گیم (Game Renter)</h1>
    <p>
      این ابزار سرعت پاسخ DNS (Resolve Time) را برای سرویس‌های گیم و بین‌المللی بررسی می‌کند.
    </p>
  </div>

  <div class="card">
    <div class="field">
      <label>DNS اصلی (Primary)</label>
      <input placeholder="مثلاً 1.1.1.1">
    </div>

    <div class="field" style="margin-top:10px">
      <label>DNS دوم (Secondary)</label>
      <input placeholder="مثلاً 8.8.8.8">
    </div>

    <div class="buttons" style="margin-top:14px">
      <button class="btn-start">شروع تست</button>
      <button class="btn-cancel">لغو</button>
      <button class="btn-clear">پاک کردن</button>
    </div>

    <div class="suggested">
      <h3>DNS های پیشنهادی</h3>

      <div class="dns-item">
        <div class="dns-info">
          <div class="dns-name">DNS-01</div>
          <div class="dns-ip">78.157.42.101 / 78.157.42.110</div>
        </div>
        <div class="dns-actions">
          <button>تست</button>
          <button>کپی</button>
        </div>
      </div>

      <div class="dns-item">
        <div class="dns-info">
          <div class="dns-name">DNS-02</div>
          <div class="dns-ip">78.157.42.102 / 78.157.42.110</div>
        </div>
        <div class="dns-actions">
          <button>تست</button>
          <button>کپی</button>
        </div>
      </div>

    </div>
  </div>

  <div class="card result">
    <div class="group">
      <div class="group-title">Xbox Servers</div>
      <div class="group-ms good">42ms</div>
    </div>
    <div class="group">
      <div class="group-title">PlayStation</div>
      <div class="group-ms warn">71ms</div>
    </div>
  </div>

</div>
</body>
</html>
