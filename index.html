<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DNS Ping Test</title>
  <style>
    body { font-family: system-ui, sans-serif; background:#0b1220; color:#e6e8ee; margin:0; }
    .wrap { max-width:560px; margin:40px auto; padding:20px; }
    .card { background:#121b2f; border:1px solid #1f2b49; border-radius:16px; padding:18px; }
    label { display:block; margin-bottom:8px; opacity:.9; }
    input { width:100%; padding:12px 14px; border-radius:12px; border:1px solid #2a3a63; background:#0b1220; color:#e6e8ee; font-size:16px; outline:none; }
    button { width:100%; margin-top:12px; padding:12px 14px; border-radius:12px; border:0; background:#3b82f6; color:white; font-size:16px; cursor:pointer; }
    button:disabled { opacity:.6; cursor:not-allowed; }
    .row { display:flex; gap:10px; margin-top:14px; align-items:center; }
    .spinner {
      width:18px; height:18px; border-radius:50%;
      border:2px solid rgba(255,255,255,.25);
      border-top-color: rgba(255,255,255,.95);
      animation: spin 0.8s linear infinite;
      display:none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .bar { flex:1; height:10px; background:#0b1220; border:1px solid #233154; border-radius:999px; overflow:hidden; }
    .bar > i { display:block; height:100%; width:0%; background:#22c55e; transition: width .25s ease; }

    .status { margin-top:12px; padding:12px; border-radius:12px; border:1px dashed #2a3a63; background:#0b1220; }
    .ok { border-color:#1f6f3b; }
    .bad { border-color:#7f1d1d; }
    .hint { opacity:.75; font-size:13px; margin-top:10px; line-height:1.8; }
    ul { margin:8px 0 0; padding:0 18px 0 0; }
    li { margin:6px 0; }
    code { background:#0b1220; border:1px solid #233154; padding:2px 6px; border-radius:8px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h2 style="margin:0 0 12px;">تست DNS (ایرانی + خارجی)</h2>

      <label for="dns">DNS (فقط عدد، مثل 1.1.1.1)</label>
      <input id="dns" inputmode="numeric" placeholder="مثلاً 8.8.8.8" />
      <button id="btn">پینگ</button>

      <div class="row">
        <div class="spinner" id="sp"></div>
        <div class="bar"><i id="bar"></i></div>
      </div>

      <div class="status" id="out">DNS رو وارد کن و بزن پینگ.</div>

      <div class="hint">
        این ابزار “Ping واقعی (ICMP)” نیست؛ سرعت پاسخ DNS برای resolve کردن دامنه‌ها رو می‌سنجه.
        دامنه‌های تست: <code>google.com</code> و <code>aparat.com</code>
      </div>
    </div>
  </div>

  <script>
    const dnsEl = document.getElementById('dns');
    const btn = document.getElementById('btn');
    const out = document.getElementById('out');
    const sp = document.getElementById('sp');
    const bar = document.getElementById('bar');

    function setLoading(on) {
      btn.disabled = on;
      sp.style.display = on ? 'block' : 'none';
      bar.style.width = on ? '15%' : '0%';
    }

    function fakeProgress() {
      let p = 15;
      const t = setInterval(() => {
        p = Math.min(92, p + Math.random() * 10);
        bar.style.width = Math.floor(p) + '%';
      }, 250);
      return () => clearInterval(t);
    }

    function isIpLike(v) {
      return /^[0-9.]+$/.test(v.trim());
    }

    function renderResult(j) {
      if (!j.ok) {
        out.className = 'status bad';
        out.textContent = `❌ Fail — ${j.error || 'unknown error'}`;
        return;
      }
      out.className = 'status ok';
      const a = j.results || [];
      out.innerHTML =
        `✅ OK<br><ul>` +
        a.map(x => `<li><b>${x.domain}</b> — ${x.ok ? (x.ms + 'ms') : ('Fail: ' + x.error)}</li>`).join('') +
        `</ul>`;
    }

    btn.addEventListener('click', async () => {
      const dns = dnsEl.value.trim();
      if (!dns || !isIpLike(dns)) {
        out.className = 'status bad';
        out.textContent = 'لطفاً DNS رو فقط به صورت عددی وارد کن (مثلاً 1.1.1.1).';
        return;
      }

      out.className = 'status';
      out.textContent = 'در حال تست...';
      setLoading(true);
      const stop = fakeProgress();

      try {
        const r = await fetch(`/api/test?dns=${encodeURIComponent(dns)}`, { cache: 'no-store' });
        const j = await r.json();
        stop();
        bar.style.width = '100%';
        renderResult(j);
      } catch (e) {
        stop();
        out.className = 'status bad';
        out.textContent = '❌ خطا در ارتباط با سرور';
      } finally {
        setTimeout(() => setLoading(false), 250);
      }
    });
  </script>
</body>
</html>
