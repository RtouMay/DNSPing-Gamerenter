<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game Renter | DNS Test</title>

<style>
:root {
  --bg: #0b0f1a;
  --card: #12182b;
  --border: #1f2847;
  --red: #e11d48;
  --red-soft: #fb7185;
  --text: #e5e7eb;
  --muted: #9ca3af;
  --ok: #22c55e;
  --bad: #ef4444;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: system-ui, -apple-system, BlinkMacSystemFont;
  background:
    radial-gradient(1200px 600px at 10% -10%, #1b1f3a 0%, transparent 40%),
    radial-gradient(800px 400px at 90% 10%, #2a0f1a 0%, transparent 45%),
    var(--bg);
  color: var(--text);
}

.container {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 24px;
}

.card {
  width: 100%;
  max-width: 520px;
  background: linear-gradient(180deg, #141a33, var(--card));
  border: 1px solid var(--border);
  border-radius: 24px;
  padding: 26px;
  box-shadow: 0 20px 60px rgba(0,0,0,.55);
  animation: fadeUp .6s ease;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(14px); }
  to { opacity: 1; transform: translateY(0); }
}

.logo {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 22px;
}
.logo img {
  width: 54px;
  height: auto;
}
.logo h1 {
  font-size: 20px;
  margin: 0;
  letter-spacing: .3px;
}

.subtitle {
  color: var(--muted);
  font-size: 14px;
  margin-bottom: 18px;
}

label {
  font-size: 14px;
  color: var(--muted);
  display: block;
  margin-bottom: 6px;
}

input {
  width: 100%;
  padding: 14px 16px;
  border-radius: 14px;
  border: 1px solid var(--border);
  background: #0b1022;
  color: var(--text);
  font-size: 16px;
  outline: none;
  transition: .25s;
}
input:focus {
  border-color: var(--red);
  box-shadow: 0 0 0 3px rgba(225,29,72,.25);
}

button {
  width: 100%;
  margin-top: 14px;
  padding: 14px;
  border-radius: 16px;
  border: none;
  background: linear-gradient(135deg, var(--red), var(--red-soft));
  color: white;
  font-size: 16px;
  cursor: pointer;
  transition: .25s;
}
button:hover { transform: translateY(-1px); }
button:disabled { opacity: .6; cursor: not-allowed; }

.progress {
  margin-top: 18px;
  height: 10px;
  border-radius: 999px;
  background: #0b1022;
  border: 1px solid var(--border);
  overflow: hidden;
}
.progress i {
  display: block;
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, var(--red), var(--red-soft));
  transition: width .3s ease;
}

.result {
  margin-top: 18px;
  padding: 16px;
  border-radius: 16px;
  background: #0b1022;
  border: 1px dashed var(--border);
  animation: fadeUp .4s ease;
}
.result.ok { border-color: rgba(34,197,94,.6); }
.result.bad { border-color: rgba(239,68,68,.6); }

ul {
  margin: 10px 0 0;
  padding: 0 18px 0 0;
}
li { margin: 6px 0; }

.footer {
  margin-top: 14px;
  font-size: 12px;
  color: var(--muted);
  text-align: center;
}
code {
  background: #0b1022;
  border: 1px solid var(--border);
  padding: 3px 6px;
  border-radius: 8px;
}
</style>
</head>

<body>
<div class="container">
  <div class="card">

    <div class="logo">
      <img src="logo.png" alt="Game Renter">
      <div>
        <h1>Game Renter</h1>
        <div class="subtitle">تست DNS (ایرانی + خارجی)</div>
      </div>
    </div>

    <label>DNS (فقط عدد، مثل 1.1.1.1)</label>
    <input id="dns" placeholder="مثلاً 8.8.8.8">

    <button id="btn">شروع تست</button>

    <div class="progress"><i id="bar"></i></div>

    <div id="out" class="result">
      DNS رو وارد کن و روی «شروع تست» بزن
    </div>

    <div class="footer">
      دامنه‌های تست: <code>google.com</code> و <code>aparat.com</code>
    </div>

  </div>
</div>

<script>
const btn = document.getElementById('btn');
const dns = document.getElementById('dns');
const bar = document.getElementById('bar');
const out = document.getElementById('out');

function fakeProgress(){
  let p = 8;
  bar.style.width = '8%';
  const t = setInterval(()=>{
    p = Math.min(90, p + Math.random()*10);
    bar.style.width = Math.floor(p) + '%';
  }, 250);
  return ()=>clearInterval(t);
}

btn.onclick = async ()=>{
  const v = dns.value.trim();
  if(!/^[0-9.]+$/.test(v)){
    out.className = 'result bad';
    out.textContent = '❌ DNS باید فقط عدد باشه';
    return;
  }

  btn.disabled = true;
  out.className = 'result';
  out.textContent = 'در حال تست...';
  const stop = fakeProgress();

  try{
    const r = await fetch(`/api/test?dns=${encodeURIComponent(v)}`);
    const j = await r.json();
    stop();
    bar.style.width = '100%';

    if(!j.ok){
      out.className = 'result bad';
      out.textContent = '❌ خطا در تست DNS';
    } else {
      out.className = 'result ok';
      out.innerHTML =
        '✅ نتیجه تست:<ul>' +
        j.results.map(x =>
          `<li><b>${x.domain}</b> — ${x.ok ? x.ms+'ms' : 'Fail'}</li>`
        ).join('') +
        '</ul>';
    }
  } catch {
    stop();
    out.className = 'result bad';
    out.textContent = '❌ ارتباط با سرور برقرار نشد';
  }

  setTimeout(()=>btn.disabled=false, 400);
};
</script>
</body>
</html>
