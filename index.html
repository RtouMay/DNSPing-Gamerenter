<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تست DNS گیم رنتر</title>

<style>
@font-face{
  font-family: "YekanBakh";
  src: url("YekanBakh-Regular.ttf") format("truetype");
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}
@font-face{
  font-family: "YekanBakh";
  src: url("YekanBakh-Bold.ttf") format("truetype");
  font-weight: 700;
  font-style: normal;
  font-display: swap;
}

:root{
  --bg:#070a12;
  --border:#1b2444;
  --text:#e5e7eb;
  --muted:#9ca3af;
  --red:#e11d48;
  --red2:#fb7185;
  --ok:#22c55e;
  --bad:#ef4444;
}

*{ box-sizing:border-box; font-family:"YekanBakh", system-ui, sans-serif; }

body{
  margin:0;
  color:var(--text);
  background:
    radial-gradient(900px 500px at 10% 0%, rgba(225,29,72,.18), transparent 45%),
    radial-gradient(900px 500px at 90% 10%, rgba(251,113,133,.10), transparent 50%),
    radial-gradient(1200px 700px at 50% 110%, rgba(34,197,94,.06), transparent 50%),
    var(--bg);
}

.container{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:16px;
}

.card{
  width:100%;
  max-width:560px;
  border-radius:22px;
  background:linear-gradient(180deg, rgba(18,24,43,.92), rgba(14,20,39,.92));
  border:1px solid rgba(27,36,68,.92);
  box-shadow:
    0 24px 80px rgba(0,0,0,.65),
    0 0 0 1px rgba(225,29,72,.10) inset,
    0 0 50px rgba(225,29,72,.06);
  padding:18px;
  position:relative;
  overflow:hidden;
}

.card:before{
  content:"";
  position:absolute; inset:-2px;
  background:radial-gradient(600px 220px at 50% 0%, rgba(225,29,72,.20), transparent 60%);
  pointer-events:none;
}
.card:after{
  content:"";
  position:absolute; inset:-45%;
  background:
    radial-gradient(600px 260px at 20% 15%, rgba(225,29,72,.18), transparent 60%),
    radial-gradient(500px 240px at 85% 25%, rgba(251,113,133,.16), transparent 65%),
    radial-gradient(700px 320px at 55% 90%, rgba(225,29,72,.08), transparent 60%),
    linear-gradient(120deg, rgba(225,29,72,.10), transparent 40%, rgba(251,113,133,.08));
  filter: blur(18px);
  opacity:.75;
  mix-blend-mode: screen;
  animation: videoGlow 6s ease-in-out infinite;
  pointer-events:none;
  z-index:0;
}
@keyframes videoGlow{
  0%{transform:translate3d(-2%,-2%,0) scale(1)}
  50%{transform:translate3d(2%,1%,0) scale(1.04)}
  100%{transform:translate3d(-2%,-2%,0) scale(1)}
}

.header, label, .inputs, .helper, button, .progress, .grid, .footer, .errorBox, .loader{
  position:relative; z-index:2;
}

/* Header */
.header{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:10px;
  padding-top:6px;
  padding-bottom:8px;
}
.header img{
  width:110px;
  height:auto;
  display:block;
  filter:drop-shadow(0 14px 30px rgba(225,29,72,.34));
}
.header .brandName{
  font-weight:700;
  font-size:15px;
  line-height:1.4;
}

/* Form */
label{ display:block; color:var(--muted); font-size:13px; margin:10px 0 8px; }

.inputs{
  display:grid;
  grid-template-columns: 1fr;
  gap:10px;
}

.inputWrap{ position:relative; }
input{
  width:100%;
  padding:14px 14px;
  border-radius:16px;
  border:1px solid rgba(27,36,68,.95);
  background:rgba(11,16,34,.92);
  color:var(--text);
  font-size:15px;
  outline:none;
  transition:.2s;
}
input:focus{
  border-color:rgba(225,29,72,.92);
  box-shadow:0 0 0 4px rgba(225,29,72,.18);
}

.helper{
  margin-top:8px;
  color: var(--muted);
  font-size:12px;
  line-height: 1.9;
}

/* Button */
button{
  width:100%;
  margin-top:12px;
  padding:14px 14px;
  border-radius:18px;
  border:none;
  color:white;
  font-size:15px;
  cursor:pointer;
  background:linear-gradient(135deg, var(--red), var(--red2));
  box-shadow:0 12px 30px rgba(225,29,72,.22);
  transition:.2s;
  font-weight:700;
}
button:hover{ transform:translateY(-1px) }
button:disabled{ opacity:.6; cursor:not-allowed; transform:none }

.progress{
  margin-top:12px;
  height:10px;
  border-radius:999px;
  background:rgba(11,16,34,.92);
  border:1px solid rgba(27,36,68,.95);
  overflow:hidden;
}
.progress i{
  display:block;
  height:100%;
  width:0%;
  background:linear-gradient(90deg, var(--red), var(--red2));
  transition:width .35s cubic-bezier(.2,.8,.2,1);
}

/* Error */
.errorBox{
  margin-top:10px;
  padding:12px 12px;
  border-radius:16px;
  border:1px dashed rgba(239,68,68,.62);
  background: rgba(11,16,34,.90);
  color:#fee2e2;
  font-size:13px;
  display:none;
  line-height:1.9;
}
.errorBox.show{ display:block; }

/* Cards */
.grid{
  margin-top:14px;
  display:grid;
  grid-template-columns: 1fr;
  gap:10px;
}

.box{
  background: rgba(11,16,34,.92);
  border:1px solid rgba(27,36,68,.95);
  border-radius:18px;
  padding:12px;
  transition:.2s;
  overflow:hidden;
}
.box.ok{ border-color: rgba(34,197,94,.55); box-shadow: 0 0 0 3px rgba(34,197,94,.08); }
.box.fail{ border-color: rgba(239,68,68,.55); box-shadow: 0 0 0 3px rgba(239,68,68,.08); }
.box.testing{ border-color: rgba(225,29,72,.35); box-shadow: 0 0 0 3px rgba(225,29,72,.06); }

.boxHead{
  display:grid;
  grid-template-columns: 1fr auto;
  gap:10px;
  align-items:center;
}

.boxTitle{
  display:grid;
  grid-template-columns: 34px 1fr;
  gap:10px;
  align-items:center;
  min-height:34px;
}
.icon{
  width:34px; height:34px;
  display:grid; place-items:center;
  border-radius:12px;
  border:1px solid rgba(27,36,68,.85);
  background: rgba(7,10,18,.35);
}
.boxTitleText{
  font-weight:700;
  font-size:14px;
  line-height:1.3;
}

.state{
  display:flex;
  flex-direction:column;
  align-items:flex-end;
  gap:6px;
  font-size:12px;
  color: var(--muted);
  min-width: 126px;
}

.stateTop{
  display:flex;
  align-items:center;
  gap:8px;
}

.light{
  width:10px; height:10px; border-radius:50%;
  background: rgba(156,163,175,.45);
  transition:.2s;
}

.box.testing .light{
  background: linear-gradient(180deg, var(--red), var(--red2));
  box-shadow: 0 0 16px rgba(225,29,72,.45);
  animation: blink 1s ease-in-out infinite;
}
.box.ok .light{ background: var(--ok); box-shadow: 0 0 16px rgba(34,197,94,.45); }
.box.fail .light{ background: var(--bad); box-shadow: 0 0 16px rgba(239,68,68,.45); }

@keyframes blink{
  0%,100%{ opacity:.55; transform:scale(.92); }
  50%{ opacity:1; transform:scale(1); }
}

.badges{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  justify-content:flex-end;
}
.pill{
  font-size:11px;
  padding:3px 8px;
  border-radius:999px;
  border:1px solid rgba(27,36,68,.82);
  background: rgba(7,10,18,.35);
  color: var(--muted);
  white-space:nowrap;
}

.actions{ margin-top:10px; }
.toggleBtn{
  width:100%;
  border:none;
  cursor:pointer;
  padding:10px 12px;
  border-radius:14px;
  background: rgba(7,10,18,.35);
  border: 1px solid rgba(27,36,68,.75);
  color: rgba(251,113,133,.98);
  font-size:12px;
  font-weight:700;
  transition:.2s;
}
.toggleBtn:hover{
  border-color: rgba(225,29,72,.55);
  box-shadow: 0 0 0 3px rgba(225,29,72,.10);
}

.details{
  margin-top:10px;
  padding-top:10px;
  border-top:1px solid rgba(27,36,68,.55);
  display:none;
  color: var(--muted);
  font-size:12px;
  line-height:1.9;
}
.box.expanded .details{ display:block; }

.dBlock{
  margin-top:10px;
  padding:10px 10px;
  border-radius:14px;
  border:1px solid rgba(27,36,68,.65);
  background: rgba(7,10,18,.22);
}
.dTitle{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  font-weight:700;
  color: var(--text);
  margin-bottom:8px;
}
.dMeta{ color: var(--muted); font-weight:400; font-size:11px; }

.dItem{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:6px 0;
  border-bottom:1px solid rgba(27,36,68,.35);
}
.dItem:last-child{ border-bottom:none; }

.domain{
  direction:ltr;
  text-align:left;
  font-weight:700;
  color: var(--text);
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
  font-size:12px;
  max-width: 68%;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.dTag{
  font-size:11px;
  padding:3px 8px;
  border-radius:999px;
  border:1px solid rgba(27,36,68,.8);
  background: rgba(7,10,18,.35);
  color: var(--muted);
  white-space:nowrap;
}
.dTag.ok{ border-color: rgba(34,197,94,.55); color:#d1fae5; }
.dTag.fail{ border-color: rgba(239,68,68,.55); color:#fee2e2; }

/* Loader */
.loader{
  position:absolute;
  inset:0;
  z-index:10;
  display:none;
  align-items:center;
  justify-content:center;
  background: rgba(0,0,0,.78);
  backdrop-filter: blur(10px);
}
.loader.show{ display:flex; animation: fadeIn .2s ease; }
@keyframes fadeIn{ from{opacity:0} to{opacity:1} }

.loaderBox{
  width:min(520px, 92%);
  text-align:center;
  padding:18px 16px;
  border-radius:22px;
  border:1px solid rgba(225,29,72,.28);
  background: rgba(11,16,34,.62);
  box-shadow: 0 18px 80px rgba(0,0,0,.6);
}

.spinner{
  width:110px;
  height:110px;
  margin: 6px auto 10px;
  position:relative;
  display:grid;
  place-items:center;
  filter: drop-shadow(0 18px 40px rgba(225,29,72,.30));
}
.spinner:before{
  content:"";
  position:absolute;
  inset:0;
  border-radius:50%;
  background:
    conic-gradient(from 210deg,
      rgba(225,29,72,0) 0deg,
      rgba(225,29,72,0) 210deg,
      rgba(225,29,72,1) 270deg,
      rgba(251,113,133,1) 310deg,
      rgba(225,29,72,0) 360deg
    );
  -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 14px), #000 0);
  mask: radial-gradient(farthest-side, transparent calc(100% - 14px), #000 0);
  opacity:.95;
  animation: spin 1.0s linear infinite;
}
.spinner:after{
  content:"";
  position:absolute;
  inset:14px;
  border-radius:50%;
  background: rgba(0,0,0,.28);
  border:1px solid rgba(255,255,255,.06);
  box-shadow: 0 0 0 1px rgba(225,29,72,.10) inset;
}
@keyframes spin{ to{ transform: rotate(360deg); } }

.loaderTitle{ font-weight:700; font-size:15px; margin-top:4px; }
.loaderStep{ margin-top:6px; color:var(--muted); font-size:13px; line-height:1.8; }

.loaderExtra{
  margin-top:10px;
  display:none;
  gap:10px;
  justify-content:center;
  align-items:center;
  flex-direction:column;
}
.loaderExtra.show{ display:flex; }

.loaderHint{
  color: var(--muted);
  font-size:12px;
  line-height:1.8;
}
.cancelBtn{
  width:min(260px, 86%);
  border:none;
  cursor:pointer;
  padding:12px 14px;
  border-radius:16px;
  background: linear-gradient(135deg, var(--bad), rgba(239,68,68,.72));
  color:white;
  font-weight:700;
  font-size:14px;
  box-shadow: 0 12px 30px rgba(239,68,68,.20);
}

.footer{
  margin-top:12px;
  text-align:center;
  color:var(--muted);
  font-size:12px;
  line-height:1.9;
}

.homeSliderWrap{
  margin-top:12px;
  border:1px solid rgba(27,36,68,.95);
  border-radius:16px;
  background:rgba(11,16,34,.86);
  padding:10px;
}
.homeSliderHead{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:12px;
  color:var(--muted);
  margin-bottom:8px;
}
.homeSliderHead a{
  color:#fda4af;
  text-decoration:none;
}
.homeSliderHead a:hover{ text-decoration:underline; }
.homeSliderFrame{
  width:100%;
  height:180px;
  border:1px solid rgba(27,36,68,.9);
  border-radius:12px;
  background:#080d1a;
}
</style>
</head>

<body>
<div class="container">
  <div class="card">

    <div class="loader" id="loader">
      <div class="loaderBox">
        <div class="spinner" aria-hidden="true"></div>
        <div class="loaderTitle">تست DNS گیم رنتر</div>
        <div class="loaderStep" id="loaderText">یه لحظه صبر کن، داریم آماده می‌کنیم…</div>

        <div class="loaderExtra" id="loaderExtra">
          <div class="loaderHint">اگه طول کشید، می‌تونی لغوش کنی.</div>
          <button class="cancelBtn" id="cancelBtn" type="button">لغو تست</button>
        </div>
      </div>
    </div>

    <div class="header">
      <img src="logo.png" alt="Game Renter">
      <div class="brandName">تست DNS گیم رنتر</div>
    </div>

    <label>DNS هاتو وارد کن</label>
    <div class="inputs">
      <div class="inputWrap">
        <input id="primary" inputmode="decimal" autocomplete="off"
               placeholder="Primary DNS (مثل 8.8.8.8)">
      </div>
      <div class="inputWrap">
        <input id="secondary" inputmode="decimal" autocomplete="off"
               placeholder="Secondary DNS (اختیاری)">
      </div>
    </div>

    <div class="helper">

    </div>

    <button id="btn">بزن بریم برای تست</button>

    <div class="progress"><i id="bar"></i></div>

    <div class="errorBox" id="err"></div>

    <div class="grid" id="grid"></div>

    <div class="homeSliderWrap">
      <div class="homeSliderHead">
        <span>اسلایدرهای صفحه اصلی گیم‌رنتر</span>
        <a href="https://gamerenter.ir/" target="_blank" rel="noopener noreferrer">باز کردن سایت</a>
      </div>
      <iframe
        class="homeSliderFrame"
        src="https://gamerenter.ir/"
        title="اسلایدر صفحه اصلی گیم رنتر"
        loading="lazy"
        referrerpolicy="no-referrer-when-downgrade">
      </iframe>
    </div>

    <div class="footer">
      نتیجه‌ها تقریبیه و بسته به اینترنت یا منطقه‌ات ممکنه فرق داشته باشه.
    </div>

  </div>
</div>

<script>
const btn = document.getElementById('btn');
const primary = document.getElementById('primary');
const secondary = document.getElementById('secondary');
const bar = document.getElementById('bar');
const err = document.getElementById('err');

const loader = document.getElementById('loader');
const loaderText = document.getElementById('loaderText');
const loaderExtra = document.getElementById('loaderExtra');
const cancelBtn = document.getElementById('cancelBtn');

const grid = document.getElementById('grid');
const GROUP_ORDER = ["xbox","playstation","games","international","internal"];

let currentController = null;
let hardTimeoutId = null;
let softTimeoutId = null;

function normalizeDigits(input){
  const map = {
    "۰":"0","۱":"1","۲":"2","۳":"3","۴":"4","۵":"5","۶":"6","۷":"7","۸":"8","۹":"9",
    "٠":"0","١":"1","٢":"2","٣":"3","٤":"4","٥":"5","٦":"6","٧":"7","٨":"8","٩":"9",
    "٫":".","٬":"","،":"."," ":""
  };
  return (input||"").toString().trim().split("").map(ch => map[ch] ?? ch).join("");
}
function looksLikeIp(ip){
  ip = normalizeDigits(ip);
  return /^\d{1,3}(\.\d{1,3}){3}$/.test(ip);
}

function showError(msg){
  err.textContent = msg;
  err.classList.add('show');
}
function clearError(){
  err.textContent = '';
  err.classList.remove('show');
}

function showLoader(text){
  loaderText.textContent = text;
  loaderExtra.classList.remove('show');
  loader.classList.add('show');
}
function setLoaderText(text){ loaderText.textContent = text; }
function hideLoader(){ loader.classList.remove('show'); loaderExtra.classList.remove('show'); }

function fakeProgress(){
  let p = 6;
  bar.style.width = '6%';
  const t = setInterval(()=>{
    p = Math.min(92, p + Math.random()*10);
    bar.style.width = Math.floor(p) + '%';
  }, 220);
  return ()=>clearInterval(t);
}

function friendlyError(apiError){
  switch(apiError){
    case "invalid_primary":
      return "Primary DNS درست نیست؛ مثلاً 8.8.8.8 بزن.";
    case "invalid_secondary":
      return "Secondary DNS درست نیست. اگه لازم نداری خالیش بذار.";
    case "private_primary":
      return "Primary DNS لوکاله؛ برای نتیجه بهتر یه DNS عمومی مثل 1.1.1.1 یا 8.8.8.8 هم امتحان کن.";
    case "private_secondary":
      return "Secondary DNS لوکاله؛ بهتره عمومی باشه تا مقایسه دقیق‌تر بشه.";
    case "same_dns":
      return "Primary و Secondary یکی هستن؛ یکی‌شون کافیه.";
    case "server_error":
      return "سمت سرور یه مشکلی پیش اومد، دوباره امتحان کن.";
    default:
      return "یه خطا پیش اومد، لطفاً دوباره امتحان کن.";
  }
}

function shortenDomain(d){
  d = String(d || "");
  if(d.length <= 26) return d;
  const start = d.slice(0, 12);
  const end = d.slice(-10);
  return `${start}…${end}`;
}

function buildCards(templateGroups){
  grid.innerHTML = templateGroups.map(g => `
    <div class="box testing" id="box-${g.key}">
      <div class="boxHead">
        <div class="boxTitle">
          <span class="icon">${g.icon}</span>
          <div class="boxTitleText">${g.title}</div>
        </div>
        <div class="state">
          <div class="stateTop">
            <span class="light"></span>
            <span id="state-${g.key}">آماده‌ست</span>
          </div>
          <div class="badges">
            <span class="pill" id="p-${g.key}">Primary: -</span>
            <span class="pill" id="s-${g.key}">Secondary: -</span>
          </div>
        </div>
      </div>

      <div class="actions">
        <button class="toggleBtn" data-key="${g.key}" data-open="0">جزئیات رو ببین</button>
      </div>

      <div class="details" id="details-${g.key}">
        هنوز تستی اجرا نشده.
      </div>
    </div>
  `).join("");

  grid.querySelectorAll(".toggleBtn").forEach(b=>{
    b.addEventListener("click", ()=>{
      const key = b.getAttribute("data-key");
      const box = document.getElementById(`box-${key}`);
      const open = b.getAttribute("data-open") === "1";
      if(open){
        box.classList.remove("expanded");
        b.textContent = "جزئیات رو ببین";
        b.setAttribute("data-open","0");
      } else {
        box.classList.add("expanded");
        b.textContent = "بستن جزئیات";
        b.setAttribute("data-open","1");
      }
    });
  });
}

function setAllTesting(){
  bar.style.width = "0%";
  clearError();

  document.querySelectorAll(".box").forEach(b=>{
    b.classList.remove("ok","fail","expanded");
    b.classList.add("testing");
  });

  for(const k of GROUP_ORDER){
    const st = document.getElementById(`state-${k}`);
    if(st) st.textContent = "داریم تست می‌کنیم…";
    const p = document.getElementById(`p-${k}`); if(p) p.textContent = "Primary: …";
    const s = document.getElementById(`s-${k}`); if(s) s.textContent = "Secondary: …";
    const d = document.getElementById(`details-${k}`); if(d) d.textContent = "نتیجه‌ها تو راهه…";
  }
}

function dnsFailureText(g, requested, meta){
  if(requested === false) return "وارد نشده";
  if(meta?.budgetHit) return "تست کامل نشد (محدودیت زمان سرور)";
  if(!g) return "این DNS جواب نداد";
  if(g.tested === 0) return "هیچ پاسخی از DNS نگرفتیم";
  if(g.okCount === 0) return "دامنه‌ها Resolve نشدن";
  return "";
}

function renderDnsBlock(label, g, requested, meta){
  const failText = dnsFailureText(g, requested, meta);

  if(!g){
    return `
      <div class="dBlock">
        <div class="dTitle">
          <span>${label}</span>
          <span class="dMeta">${failText}</span>
        </div>
      </div>
    `;
  }

  const blockMeta = failText || `موفق: ${g.okCount}/${g.total} • میانگین: ${g.avgMs == null ? "-" : (g.avgMs + "ms")}`;
  const items = (g.items || []).map(it=>{
    const tagCls = it.ok ? "ok" : "fail";
    const tagTxt = it.ok ? (it.ms + "ms") : "FAIL";
    const shown = shortenDomain(it.domain);
    return `
      <div class="dItem">
        <div class="domain" title="${it.domain}">${shown}</div>
        <span class="dTag ${tagCls}">${tagTxt}</span>
      </div>
    `;
  }).join("");

  return `
    <div class="dBlock">
      <div class="dTitle">
        <span>${label}</span>
        <span class="dMeta">${blockMeta}</span>
      </div>
      ${items}
    </div>
  `;
}

function dnsPillText(label, g, requested){
  if(requested === false) return `${label}: وارد نشده`;
  if(!g) return `${label}: جواب نداد`;
  if(g.okCount === 0) return `${label}: مشکل‌دار`;
  return `${label}: ${g.avgMs == null ? "-" : g.avgMs + "ms"}`;
}

function renderGroup(key, gp, gs, opts = {}){
  const inferredSecondary = Boolean(normalizeDigits(secondary?.value?.trim?.() || ""));
  const { hasSecondary = inferredSecondary, primaryMeta = null, secondaryMeta = null } = opts;
  const box = document.getElementById(`box-${key}`);
  const stateEl = document.getElementById(`state-${key}`);
  const pEl = document.getElementById(`p-${key}`);
  const sEl = document.getElementById(`s-${key}`);
  const details = document.getElementById(`details-${key}`);

  const overallOk = (gp && gp.status === "ok") || (gs && gs.status === "ok");

  box.classList.remove("testing");
  box.classList.add(overallOk ? "ok" : "fail");

  stateEl.textContent = overallOk ? "قابل استفاده ✅" : "مشکل دارد ❌";

  pEl.textContent = dnsPillText("Primary", gp, true);
  sEl.textContent = dnsPillText("Secondary", gs, hasSecondary);

  details.innerHTML = `
    ${renderDnsBlock("Primary DNS", gp, true, primaryMeta)}
    ${renderDnsBlock("Secondary DNS", gs, hasSecondary, secondaryMeta)}
  `;
}

function clearTimers(){
  if(hardTimeoutId) clearTimeout(hardTimeoutId);
  if(softTimeoutId) clearTimeout(softTimeoutId);
  hardTimeoutId = null;
  softTimeoutId = null;
}

function cancelRequest(reason){
  try{
    if(currentController) currentController.abort();
  } catch(e){}
  currentController = null;
  clearTimers();
  hideLoader();
  bar.style.width = "100%";
  showError(reason || "تست متوقف شد.");
  btn.disabled = false;
}

(function init(){
  const templates = [
    { key:"xbox", title:"سرورهای Xbox", icon:"🎮" },
    { key:"playstation", title:"سرورهای PlayStation", icon:"🎮" },
    { key:"games", title:"سرور بازی‌های پرطرفدار", icon:"🔥" },
    { key:"international", title:"سرورهای بین‌المللی", icon:"🌍" },
    { key:"internal", title:"سرورهای داخلی", icon:"🇮🇷" },
  ];
  buildCards(templates);
})();

cancelBtn.onclick = ()=> cancelRequest("تست رو متوقف کردیم.");

btn.onclick = async ()=>{
  clearError();
  clearTimers();

  const p = normalizeDigits(primary.value.trim());
  const s = normalizeDigits(secondary.value.trim());

  if(!p || !looksLikeIp(p)){
    showError("Primary DNS درست نیست؛ مثلاً 8.8.8.8 بزن.");
    return;
  }
  if(s && !looksLikeIp(s)){
    showError("Secondary DNS درست نیست. اگه لازم نداری خالیش بذار.");
    return;
  }
  if(s && s === p){
    showError("Primary و Secondary یکی هستن؛ یکی‌شون کافیه.");
    return;
  }

  btn.disabled = true;
  setAllTesting();
  showLoader("یه لحظه صبر کن، داریم آماده می‌کنیم…");

  softTimeoutId = setTimeout(()=> loaderExtra.classList.add("show"), 20000);
  hardTimeoutId = setTimeout(()=> cancelRequest("خطا در سرور"), 120000);

  const stop = fakeProgress();
  currentController = new AbortController();

  try{
    setLoaderText("داریم سرورهای Xbox رو تست می‌کنیم…");
    await new Promise(r=>setTimeout(r, 220));
    setLoaderText("داریم سرورهای PlayStation رو تست می‌کنیم…");
    await new Promise(r=>setTimeout(r, 220));
    setLoaderText("داریم سرور بازی‌های محبوب رو تست می‌کنیم…");
    await new Promise(r=>setTimeout(r, 220));
    setLoaderText("داریم سرورهای بین‌المللی رو تست می‌کنیم…");
    await new Promise(r=>setTimeout(r, 220));
    setLoaderText("داریم سرورهای داخلی رو تست می‌کنیم…");

    const url = `/api/test?primary=${encodeURIComponent(p)}${s ? `&secondary=${encodeURIComponent(s)}` : ""}`;
    const r = await fetch(url, { cache:"no-store", signal: currentController.signal });
    const j = await r.json();

    stop();
    bar.style.width = "100%";
    clearTimers();
    currentController = null;

    if(!j.ok){
      hideLoader();
      showError(friendlyError(j.error));
      btn.disabled = false;
      return;
    }

    // ✅ اگر DNS عملاً هیچ دامنه‌ای رو resolve نکرد
    const primaryOk = j.results?.primary?.dnsOk !== false;
    const secondaryOk = j.results?.secondary ? (j.results.secondary.dnsOk !== false) : true;

    // حتی اگر هر دو DNS مشکل داشته باشن هم نتیجه کارت‌ها رو رندر می‌کنیم
    if(!primaryOk || (j.results?.secondary && !secondaryOk)){
      showError("این DNS یا آنلاین نیست یا درست جواب نمی‌ده.");
    }

    const primaryResult = j.results?.primary || {};
    const secondaryResult = j.results?.secondary || {};
    const primaryGroups = Object.fromEntries((primaryResult.groups || []).map(g=>[g.key, g]));
    const secondaryGroups = Object.fromEntries((secondaryResult.groups || []).map(g=>[g.key, g]));

    for(const key of GROUP_ORDER){
      const gp = primaryGroups[key] || null;
      const gs = (j.results?.secondary ? (secondaryGroups[key] || null) : null);
      renderGroup(key, gp, gs, {
        hasSecondary: Boolean(s),
        primaryMeta: primaryResult.meta || null,
        secondaryMeta: secondaryResult.meta || null,
      });
      await new Promise(r=>setTimeout(r, 120));
    }

    setLoaderText("تمومه! تست کامل شد ✅");
    await new Promise(r=>setTimeout(r, 220));
    hideLoader();

  } catch(e){
    stop();
    bar.style.width = "100%";
    clearTimers();

    if(e && e.name === "AbortError"){
      hideLoader();
      showError("تست رو متوقف کردیم.");
      btn.disabled = false;
      return;
    }

    hideLoader();
    showError("سرور خطا داد؛ یه بار دیگه امتحان کن.");
  }

  setTimeout(()=>btn.disabled=false, 350);
};
</script>
