<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>گیم رنتر | تست DNS</title>

<style>
@font-face{
  font-family: "YekanBakh";
  src: url("YekanBakh-Regular.ttf") format("truetype");
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}
@font-face{
  font-family: "YekanBakh";
  src: url("YekanBakh-Bold.ttf") format("truetype");
  font-weight: 700;
  font-style: normal;
  font-display: swap;
}

:root{
  --bg:#070a12;
  --border:#1b2444;
  --text:#e5e7eb;
  --muted:#9ca3af;
  --red:#e11d48;
  --red2:#fb7185;
  --ok:#22c55e;
  --bad:#ef4444;
  --panel:#0b1022;
}

*{ box-sizing:border-box; font-family:"YekanBakh", system-ui, sans-serif; }

body{
  margin:0;
  color:var(--text);
  background:
    radial-gradient(900px 500px at 10% 0%, rgba(225,29,72,.18), transparent 45%),
    radial-gradient(900px 500px at 90% 10%, rgba(251,113,133,.10), transparent 50%),
    radial-gradient(1200px 700px at 50% 110%, rgba(34,197,94,.06), transparent 50%),
    var(--bg);
}

.container{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:16px;
}

.card{
  width:100%;
  max-width:560px;            /* موبایل محور */
  border-radius:22px;
  background:linear-gradient(180deg, rgba(18,24,43,.92), rgba(14,20,39,.92));
  border:1px solid rgba(27,36,68,.92);
  box-shadow:
    0 24px 80px rgba(0,0,0,.65),
    0 0 0 1px rgba(225,29,72,.10) inset,
    0 0 50px rgba(225,29,72,.06);
  padding:18px;
  position:relative;
  overflow:hidden;
}

.card:before{
  content:"";
  position:absolute; inset:-2px;
  background:radial-gradient(600px 220px at 50% 0%, rgba(225,29,72,.20), transparent 60%);
  pointer-events:none;
}
.card:after{
  content:"";
  position:absolute; inset:-45%;
  background:
    radial-gradient(600px 260px at 20% 15%, rgba(225,29,72,.18), transparent 60%),
    radial-gradient(500px 240px at 85% 25%, rgba(251,113,133,.16), transparent 65%),
    radial-gradient(700px 320px at 55% 90%, rgba(225,29,72,.08), transparent 60%),
    linear-gradient(120deg, rgba(225,29,72,.10), transparent 40%, rgba(251,113,133,.08));
  filter: blur(18px);
  opacity:.75;
  mix-blend-mode: screen;
  animation: videoGlow 6s ease-in-out infinite;
  pointer-events:none;
  z-index:0;
}
@keyframes videoGlow{
  0%{transform:translate3d(-2%,-2%,0) scale(1)}
  50%{transform:translate3d(2%,1%,0) scale(1.04)}
  100%{transform:translate3d(-2%,-2%,0) scale(1)}
}

.header, label, .inputs, .helper, button, .progress, .grid, .footer, .errorBox, .loader{
  position:relative; z-index:2;
}

/* ===== Header: centered (mobile-first) ===== */
.header{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:10px;
  padding-top:6px;
  padding-bottom:8px;
}
.header img{
  width:110px;
  height:auto;
  display:block;
  filter:drop-shadow(0 14px 30px rgba(225,29,72,.34));
}
.header .brandName{
  font-weight:700;
  font-size:16px;
  line-height:1.2;
}

/* ===== Form ===== */
label{ display:block; color:var(--muted); font-size:13px; margin:10px 0 8px; }

.inputs{
  display:grid;
  grid-template-columns: 1fr;
  gap:10px;
}

.inputWrap{ position:relative; }
input{
  width:100%;
  padding:14px 14px;
  border-radius:16px;
  border:1px solid rgba(27,36,68,.95);
  background:rgba(11,16,34,.92);
  color:var(--text);
  font-size:15px;
  outline:none;
  transition:.2s;
}
input:focus{
  border-color:rgba(225,29,72,.92);
  box-shadow:0 0 0 4px rgba(225,29,72,.18);
}

.helper{
  margin-top:8px;
  color: var(--muted);
  font-size:12px;
  line-height: 1.9;
}

/* ===== Button ===== */
button{
  width:100%;
  margin-top:12px;
  padding:14px 14px;
  border-radius:18px;
  border:none;
  color:white;
  font-size:15px;
  cursor:pointer;
  background:linear-gradient(135deg, var(--red), var(--red2));
  box-shadow:0 12px 30px rgba(225,29,72,.22);
  transition:.2s;
  font-weight:700;
}
button:hover{ transform:translateY(-1px) }
button:disabled{ opacity:.6; cursor:not-allowed; transform:none }

.progress{
  margin-top:12px;
  height:10px;
  border-radius:999px;
  background:rgba(11,16,34,.92);
  border:1px solid rgba(27,36,68,.95);
  overflow:hidden;
}
.progress i{
  display:block;
  height:100%;
  width:0%;
  background:linear-gradient(90deg, var(--red), var(--red2));
  transition:width .35s cubic-bezier(.2,.8,.2,1);
}

/* ===== Error ===== */
.errorBox{
  margin-top:10px;
  padding:12px 12px;
  border-radius:16px;
  border:1px dashed rgba(239,68,68,.62);
  background: rgba(11,16,34,.90);
  color:#fee2e2;
  font-size:13px;
  display:none;
  line-height:1.9;
}
.errorBox.show{ display:block; }

/* ===== Cards: mobile-first single column ===== */
.grid{
  margin-top:14px;
  display:grid;
  grid-template-columns: 1fr;
  gap:10px;
}

.box{
  background: rgba(11,16,34,.92);
  border:1px solid rgba(27,36,68,.95);
  border-radius:18px;
  padding:12px;
  transition:.2s;
  overflow:hidden;
}
.box.ok{ border-color: rgba(34,197,94,.55); box-shadow: 0 0 0 3px rgba(34,197,94,.08); }
.box.fail{ border-color: rgba(239,68,68,.55); box-shadow: 0 0 0 3px rgba(239,68,68,.08); }
.box.testing{ border-color: rgba(225,29,72,.35); box-shadow: 0 0 0 3px rgba(225,29,72,.06); }

.boxHead{
  display:grid;
  grid-template-columns: 1fr auto; /* عنوان + وضعیت */
  gap:10px;
  align-items:center;
}

.boxTitle{
  display:grid;
  grid-template-columns: 34px 1fr;
  gap:10px;
  align-items:center;
  min-height:34px;
}
.icon{
  width:34px; height:34px;
  display:grid; place-items:center;
  border-radius:12px;
  border:1px solid rgba(27,36,68,.85);
  background: rgba(7,10,18,.35);
}
.boxTitleText{
  font-weight:700;
  font-size:14px;       /* همه کارت‌ها یک اندازه */
  line-height:1.3;
}

.state{
  display:flex;
  flex-direction:column;
  align-items:flex-end;
  gap:6px;
  font-size:12px;
  color: var(--muted);
  min-width: 120px;
}

.stateTop{
  display:flex;
  align-items:center;
  gap:8px;
}

.light{
  width:10px; height:10px; border-radius:50%;
  background: rgba(156,163,175,.45);
  transition:.2s;
}

.box.testing .light{
  background: linear-gradient(180deg, var(--red), var(--red2));
  box-shadow: 0 0 16px rgba(225,29,72,.45);
  animation: blink 1s ease-in-out infinite;
}
.box.ok .light{ background: var(--ok); box-shadow: 0 0 16px rgba(34,197,94,.45); }
.box.fail .light{ background: var(--bad); box-shadow: 0 0 16px rgba(239,68,68,.45); }

@keyframes blink{
  0%,100%{ opacity:.55; transform:scale(.92); }
  50%{ opacity:1; transform:scale(1); }
}

.badges{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  justify-content:flex-end;
}
.pill{
  font-size:11px;
  padding:3px 8px;
  border-radius:999px;
  border:1px solid rgba(27,36,68,.82);
  background: rgba(7,10,18,.35);
  color: var(--muted);
  white-space:nowrap;
}

/* expand */
.actions{ margin-top:10px; }
.toggleBtn{
  width:100%;
  border:none;
  cursor:pointer;
  padding:10px 12px;
  border-radius:14px;
  background: rgba(7,10,18,.35);
  border: 1px solid rgba(27,36,68,.75);
  color: rgba(251,113,133,.98);
  font-size:12px;
  font-weight:700;
  transition:.2s;
}
.toggleBtn:hover{
  border-color: rgba(225,29,72,.55);
  box-shadow: 0 0 0 3px rgba(225,29,72,.10);
}

.details{
  margin-top:10px;
  padding-top:10px;
  border-top:1px solid rgba(27,36,68,.55);
  display:none;
  color: var(--muted);
  font-size:12px;
  line-height:1.9;
}
.box.expanded .details{ display:block; }

.dBlock{
  margin-top:10px;
  padding:10px 10px;
  border-radius:14px;
  border:1px solid rgba(27,36,68,.65);
  background: rgba(7,10,18,.22);
}
.dTitle{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  font-weight:700;
  color: var(--text);
  margin-bottom:8px;
}
.dMeta{ color: var(--muted); font-weight:400; font-size:11px; }

.dItem{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:6px 0;
  border-bottom:1px solid rgba(27,36,68,.35);
}
.dItem:last-child{ border-bottom:none; }

.domain{
  direction:ltr;
  text-align:left;
  font-weight:700;
  color: var(--text);
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
  font-size:12px;
  max-width: 68%;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.dTag{
  font-size:11px;
  padding:3px 8px;
  border-radius:999px;
  border:1px solid rgba(27,36,68,.8);
  background: rgba(7,10,18,.35);
  color: var(--muted);
  white-space:nowrap;
}
.dTag.ok{ border-color: rgba(34,197,94,.55); color:#d1fae5; }
.dTag.fail{ border-color: rgba(239,68,68,.55); color:#fee2e2; }

/* ===== Loader ===== */
.loader{
  position:absolute;
  inset:0;
  z-index:10;
  display:none;
  align-items:center;
  justify-content:center;
  background: rgba(0,0,0,.78);
  backdrop-filter: blur(10px);
}
.loader.show{ display:flex; animation: fadeIn .2s ease; }
@keyframes fadeIn{ from{opacity:0} to{opacity:1} }

.loaderBox{
  width:min(520px, 92%);
  text-align:center;
  padding:18px 16px;
  border-radius:22px;
  border:1px solid rgba(225,29,72,.28);
  background: rgba(11,16,34,.62);
  box-shadow: 0 18px 80px rgba(0,0,0,.6);
}

.spinner{
  width:110px;
  height:110px;
  margin: 6px auto 10px;
  position:relative;
  display:grid;
  place-items:center;
  filter: drop-shadow(0 18px 40px rgba(225,29,72,.30));
}
.spinner:before{
  content:"";
  position:absolute;
  inset:0;
  border-radius:50%;
  background:
    conic-gradient(from 210deg,
      rgba(225,29,72,0) 0deg,
      rgba(225,29,72,0) 210deg,
      rgba(225,29,72,1) 270deg,
      rgba(251,113,133,1) 310deg,
      rgba(225,29,72,0) 360deg
    );
  -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 14px), #000 0);
  mask: radial-gradient(farthest-side, transparent calc(100% - 14px), #000 0);
  opacity:.95;
  animation: spin 1.0s linear infinite;
}
.spinner:after{
  content:"";
  position:absolute;
  inset:14px;
  border-radius:50%;
  background: rgba(0,0,0,.28);
  border:1px solid rgba(255,255,255,.06);
  box-shadow: 0 0 0 1px rgba(225,29,72,.10) inset;
}
@keyframes spin{ to{ transform: rotate(360deg); } }

.loaderTitle{ font-weight:700; font-size:15px; margin-top:4px; }
.loaderStep{ margin-top:6px; color:var(--muted); font-size:13px; line-height:1.8; }

.footer{
  margin-top:12px;
  text-align:center;
  color:var(--muted);
  font-size:12px;
  line-height:1.9;
}
</style>
</head>

<body>
<div class="container">
  <div class="card">

    <div class="loader" id="loader">
      <div class="loaderBox">
        <div class="spinner" aria-hidden="true"></div>
        <div class="loaderTitle">گیم رنتر</div>
        <div class="loaderStep" id="loaderText">در حال آماده‌سازی هستیم…</div>
      </div>
    </div>

    <!-- Header -->
    <div class="header">
      <img src="logo.png" alt="Game Renter">
      <div class="brandName">گیم رنتر</div>
    </div>

    <label>DNS را وارد کنید (DNS دوم اختیاری است)</label>
    <div class="inputs">
      <div class="inputWrap">
        <input id="primary" inputmode="decimal" autocomplete="off"
               placeholder="DNS پرایمری (مثل 8.8.8.8 یا ۸.۸.۸.۸)">
      </div>
      <div class="inputWrap">
        <input id="secondary" inputmode="decimal" autocomplete="off"
               placeholder="DNS سکندری (اختیاری)">
      </div>
    </div>

    <div class="helper">
      اگر فقط یکی وارد شود، همان تست می‌شود. اگر هر دو وارد شوند، هر دو DNS جداگانه بررسی می‌شوند.
    </div>

    <button id="btn">شروع تست</button>

    <div class="progress"><i id="bar"></i></div>

    <div class="errorBox" id="err"></div>

    <div class="grid" id="grid"></div>

    <div class="footer">
      نتیجه‌ها بر اساس Resolve شدن دامنه‌های کلیدی هر سرویس است و ممکن است با اینترنت/منطقه فرق کند.
    </div>

  </div>
</div>

<script>
const btn = document.getElementById('btn');
const primary = document.getElementById('primary');
const secondary = document.getElementById('secondary');
const bar = document.getElementById('bar');
const err = document.getElementById('err');

const loader = document.getElementById('loader');
const loaderText = document.getElementById('loaderText');
const grid = document.getElementById('grid');

const GROUP_ORDER = ["xbox","playstation","games","international","internal"];

function normalizeDigits(input){
  const map = {
    "۰":"0","۱":"1","۲":"2","۳":"3","۴":"4","۵":"5","۶":"6","۷":"7","۸":"8","۹":"9",
    "٠":"0","١":"1","٢":"2","٣":"3","٤":"4","٥":"5","٦":"6","٧":"7","٨":"8","٩":"9",
    "٫":".","٬":"","،":"."," ":""
  };
  return (input||"").toString().trim().split("").map(ch => map[ch] ?? ch).join("");
}
function looksLikeIp(ip){
  ip = normalizeDigits(ip);
  return /^\d{1,3}(\.\d{1,3}){3}$/.test(ip);
}

function showError(msg){
  err.textContent = msg;
  err.classList.add('show');
}
function clearError(){
  err.textContent = '';
  err.classList.remove('show');
}

function showLoader(text){
  loaderText.textContent = text;
  loader.classList.add('show');
}
function setLoaderText(text){ loaderText.textContent = text; }
function hideLoader(){ loader.classList.remove('show'); }

function fakeProgress(){
  let p = 6;
  bar.style.width = '6%';
  const t = setInterval(()=>{
    p = Math.min(92, p + Math.random()*10);
    bar.style.width = Math.floor(p) + '%';
  }, 220);
  return ()=>clearInterval(t);
}

function friendlyError(apiError){
  switch(apiError){
    case "invalid_primary":
      return "DNS پرایمری درست وارد نشده. نمونه: 8.8.8.8 یا ۱.۱.۱.۱";
    case "invalid_secondary":
      return "DNS سکندری درست وارد نشده. می‌توانید خالی بگذارید.";
    case "private_primary":
      return "DNS پرایمری خصوصی/لوکال است. بهتر است یک DNS عمومی وارد کنید (مثل 1.1.1.1).";
    case "private_secondary":
      return "DNS سکندری خصوصی/لوکال است. اگر وارد می‌کنید، بهتر است عمومی باشد.";
    case "same_dns":
      return "DNS پرایمری و سکندری یکی هستند؛ وارد کردن یکی کافی است.";
    case "server_error":
      return "یک مشکل سمت سرور پیش آمد. لطفاً دوباره امتحان کنید.";
    default:
      return "یک خطا رخ داد. لطفاً دوباره امتحان کنید.";
  }
}

/* کوتاه‌سازی فقط برای نمایش (تست با دامنه کامل انجام می‌شود) */
function shortenDomain(d){
  d = String(d || "");
  if(d.length <= 26) return d;
  const start = d.slice(0, 12);
  const end = d.slice(-10);
  return `${start}…${end}`;
}

function buildCards(templateGroups){
  grid.innerHTML = templateGroups.map(g => `
    <div class="box testing" id="box-${g.key}">
      <div class="boxHead">
        <div class="boxTitle">
          <span class="icon">${g.icon}</span>
          <div class="boxTitleText">${g.title}</div>
        </div>
        <div class="state">
          <div class="stateTop">
            <span class="light"></span>
            <span id="state-${g.key}">آماده</span>
          </div>
          <div class="badges">
            <span class="pill" id="p-${g.key}">پرایمری: -</span>
            <span class="pill" id="s-${g.key}">سکندری: -</span>
          </div>
        </div>
      </div>

      <div class="actions">
        <button class="toggleBtn" data-key="${g.key}" data-open="0">جزئیات بیشتر</button>
      </div>

      <div class="details" id="details-${g.key}">
        هنوز تست انجام نشده است.
      </div>
    </div>
  `).join("");

  grid.querySelectorAll(".toggleBtn").forEach(b=>{
    b.addEventListener("click", ()=>{
      const key = b.getAttribute("data-key");
      const box = document.getElementById(`box-${key}`);
      const open = b.getAttribute("data-open") === "1";
      if(open){
        box.classList.remove("expanded");
        b.textContent = "جزئیات بیشتر";
        b.setAttribute("data-open","0");
      } else {
        box.classList.add("expanded");
        b.textContent = "بستن جزئیات";
        b.setAttribute("data-open","1");
      }
    });
  });
}

function setAllTesting(){
  bar.style.width = "0%";
  clearError();

  document.querySelectorAll(".box").forEach(b=>{
    b.classList.remove("ok","fail","expanded");
    b.classList.add("testing");
  });

  GROUP_ORDER.forEach(k=>{
    const st = document.getElementById(`state-${k}`);
    if(st) st.textContent = "در حال تست…";
    const p = document.getElementById(`p-${k}`); if(p) p.textContent = "پرایمری: …";
    const s = document.getElementById(`s-${k}`); if(s) s.textContent = "سکندری: …";
    const d = document.getElementById(`details-${k}`); if(d) d.textContent = "در حال دریافت نتیجه…";
  });
}

function renderDnsBlock(label, g){
  if(!g){
    return `
      <div class="dBlock">
        <div class="dTitle">
          <span>${label}</span>
          <span class="dMeta">وارد نشده</span>
        </div>
      </div>
    `;
  }

  const meta = `موفق: ${g.okCount}/${g.total} • میانگین: ${g.avgMs == null ? "-" : (g.avgMs + "ms")}`;
  const items = (g.items || []).map(it=>{
    const tagCls = it.ok ? "ok" : "fail";
    const tagTxt = it.ok ? (it.ms + "ms") : "FAIL";
    const shown = shortenDomain(it.domain);
    return `
      <div class="dItem">
        <div class="domain" title="${it.domain}">${shown}</div>
        <span class="dTag ${tagCls}">${tagTxt}</span>
      </div>
    `;
  }).join("");

  return `
    <div class="dBlock">
      <div class="dTitle">
        <span>${label}</span>
        <span class="dMeta">${meta}</span>
      </div>
      ${items}
    </div>
  `;
}

function renderGroup(key, gp, gs){
  const box = document.getElementById(`box-${key}`);
  const stateEl = document.getElementById(`state-${key}`);
  const pEl = document.getElementById(`p-${key}`);
  const sEl = document.getElementById(`s-${key}`);
  const details = document.getElementById(`details-${key}`);

  const overallOk = (gp && gp.status === "ok") || (gs && gs.status === "ok");

  box.classList.remove("testing");
  box.classList.add(overallOk ? "ok" : "fail");

  stateEl.textContent = overallOk ? "قابل استفاده ✅" : "مشکل دارد ❌";

  pEl.textContent = gp ? `پرایمری: ${gp.avgMs == null ? "-" : gp.avgMs + "ms"}` : "پرایمری: -";
  sEl.textContent = gs ? `سکندری: ${gs.avgMs == null ? "-" : gs.avgMs + "ms"}` : "سکندری: -";

  details.innerHTML = `
    ${renderDnsBlock("DNS پرایمری", gp)}
    ${renderDnsBlock("DNS سکندری", gs)}
  `;
}

(function init(){
  const templates = [
    { key:"xbox", title:"سرورهای Xbox", icon:"🎮" },
    { key:"playstation", title:"سرورهای PlayStation", icon:"🎮" },
    { key:"games", title:"سرور بازی‌های پرطرفدار", icon:"🔥" },
    { key:"international", title:"سرورهای بین‌المللی", icon:"🌍" },
    { key:"internal", title:"سرورهای داخلی", icon:"🇮🇷" },
  ];
  buildCards(templates);
})();

btn.onclick = async ()=>{
  clearError();

  const pRaw = primary.value.trim();
  const sRaw = secondary.value.trim();

  const p = normalizeDigits(pRaw);
  const s = normalizeDigits(sRaw);

  if(!p || !looksLikeIp(p)){
    showError("DNS پرایمری معتبر نیست. نمونه: 8.8.8.8 یا ۸.۸.۸.۸");
    return;
  }
  if(s && !looksLikeIp(s)){
    showError("DNS سکندری معتبر نیست. اگر نیاز ندارید، خالی بگذارید.");
    return;
  }
  if(s && s === p){
    showError("DNS پرایمری و سکندری یکی هستند؛ وارد کردن یکی کافی است.");
    return;
  }

  btn.disabled = true;
  setAllTesting();
  showLoader("در حال آماده‌سازی هستیم…");
  const stop = fakeProgress();

  try{
    setLoaderText("در حال تست سرورهای Xbox هستیم…");
    await new Promise(r=>setTimeout(r, 220));
    setLoaderText("در حال تست سرورهای PlayStation هستیم…");
    await new Promise(r=>setTimeout(r, 220));
    setLoaderText("در حال تست سرور بازی‌های پرطرفدار هستیم…");
    await new Promise(r=>setTimeout(r, 220));
    setLoaderText("در حال تست سرورهای بین‌المللی هستیم…");
    await new Promise(r=>setTimeout(r, 220));
    setLoaderText("در حال تست سرورهای داخلی هستیم…");

    const url = `/api/test?primary=${encodeURIComponent(p)}${s ? `&secondary=${encodeURIComponent(s)}` : ""}`;
    const r = await fetch(url, { cache: "no-store" });
    const j = await r.json();

    stop();
    bar.style.width = "100%";

    if(!j.ok){
      hideLoader();
      showError(friendlyError(j.error));
      btn.disabled = false;
      return;
    }

    const primaryGroups = Object.fromEntries((j.results?.primary?.groups || []).map(g=>[g.key, g]));
    const secondaryGroups = Object.fromEntries((j.results?.secondary?.groups || []).map(g=>[g.key, g]));

    for(const key of GROUP_ORDER){
      const gp = primaryGroups[key] || null;
      const gs = (j.results?.secondary ? (secondaryGroups[key] || null) : null);
      renderGroup(key, gp, gs);
      await new Promise(r=>setTimeout(r, 120));
    }

    setLoaderText("تست کامل شد ✅");
    await new Promise(r=>setTimeout(r, 220));
    hideLoader();

  } catch(e){
    stop();
    bar.style.width = "100%";
    hideLoader();
    showError("ارتباط با سرور برقرار نشد. لطفاً دوباره امتحان کنید.");
  }

  setTimeout(()=>btn.disabled=false, 350);
};
</script>
</body>
</html>
