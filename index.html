<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>گیم رنتر | تست DNS</title>

<style>
@font-face{
  font-family:"YekanBakh";
  src:url("YekanBakh-Regular.ttf") format("truetype");
  font-weight:400;
}
@font-face{
  font-family:"YekanBakh";
  src:url("YekanBakh-Bold.ttf") format("truetype");
  font-weight:700;
}

:root{
  --bg:#070a12;
  --card:#0e1427;
  --border:#1b2444;
  --text:#e5e7eb;
  --muted:#9ca3af;
  --red:#e11d48;
  --red2:#fb7185;
  --ok:#22c55e;
  --bad:#ef4444;
}

*{
  box-sizing:border-box;
  font-family:"YekanBakh",system-ui,sans-serif;
}

body{
  margin:0;
  background:
    radial-gradient(900px 500px at 10% 0%, rgba(225,29,72,.18), transparent 45%),
    radial-gradient(900px 500px at 90% 10%, rgba(251,113,133,.10), transparent 50%),
    var(--bg);
  color:var(--text);
}

.container{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:24px;
}

.card{
  width:100%;
  max-width:760px;
  background:linear-gradient(180deg,#12182b,#0e1427);
  border:1px solid var(--border);
  border-radius:26px;
  padding:26px;
  box-shadow:0 30px 90px rgba(0,0,0,.7);
  position:relative;
  overflow:hidden;
}

/* ===== Header ===== */
.header{
  display:flex;
  justify-content:flex-end;
  margin-bottom:16px;
}

.brand{
  display:flex;
  flex-direction:column;
  align-items:flex-end;
  gap:8px;
}

.brand img{
  width:120px;
  display:block;
  filter:drop-shadow(0 12px 28px rgba(225,29,72,.35));
}

.brandName{
  font-weight:700;
  font-size:16px;
}

/* ===== Inputs ===== */
label{
  display:block;
  font-size:14px;
  color:var(--muted);
  margin-bottom:8px;
}

.inputs{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

@media(max-width:640px){
  .inputs{grid-template-columns:1fr}
  .brand img{width:96px}
}

input{
  width:100%;
  padding:14px 16px;
  border-radius:16px;
  border:1px solid var(--border);
  background:#0b1022;
  color:var(--text);
  font-size:15px;
  outline:none;
}

input:focus{
  border-color:var(--red);
  box-shadow:0 0 0 4px rgba(225,29,72,.2);
}

.helper{
  margin-top:8px;
  font-size:12px;
  color:var(--muted);
  line-height:1.8;
}

/* ===== Button ===== */
button{
  width:100%;
  margin-top:16px;
  padding:14px;
  border:none;
  border-radius:18px;
  background:linear-gradient(135deg,var(--red),var(--red2));
  color:white;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
  box-shadow:0 14px 30px rgba(225,29,72,.3);
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

/* ===== Progress ===== */
.progress{
  margin-top:14px;
  height:10px;
  border-radius:999px;
  background:#0b1022;
  border:1px solid var(--border);
  overflow:hidden;
}
.progress i{
  display:block;
  height:100%;
  width:0%;
  background:linear-gradient(90deg,var(--red),var(--red2));
  transition:width .3s;
}

/* ===== Error ===== */
.error{
  display:none;
  margin-top:12px;
  padding:12px;
  border-radius:14px;
  border:1px dashed var(--bad);
  background:#0b1022;
  color:#fee2e2;
  font-size:13px;
}
.error.show{display:block}

/* ===== Result Cards ===== */
.grid{
  margin-top:18px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

@media(max-width:640px){
  .grid{grid-template-columns:1fr}
}

.box{
  background:#0b1022;
  border:1px solid var(--border);
  border-radius:18px;
  padding:14px;
}

.box.ok{border-color:rgba(34,197,94,.6)}
.box.fail{border-color:rgba(239,68,68,.6)}

.boxHead{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.boxTitle{
  display:flex;
  gap:8px;
  font-weight:700;
}

.state{
  font-size:12px;
  color:var(--muted);
}

.toggle{
  width:100%;
  margin-top:12px;
  padding:10px;
  border-radius:14px;
  border:1px solid var(--border);
  background:#070a12;
  color:var(--red2);
  cursor:pointer;
  font-size:12px;
  font-weight:700;
}

.details{
  display:none;
  margin-top:10px;
  padding-top:10px;
  border-top:1px solid var(--border);
  font-size:12px;
  color:var(--muted);
  line-height:1.9;
}

.box.open .details{display:block}

/* ===== Footer ===== */
.footer{
  margin-top:14px;
  text-align:center;
  font-size:12px;
  color:var(--muted);
  line-height:1.8;
}
</style>
</head>

<body>
<div class="container">
  <div class="card">

    <!-- Header -->
    <div class="header">
      <div class="brand">
        <img src="logo.png" alt="Game Renter">
        <div class="brandName">گیم رنتر</div>
      </div>
    </div>

    <label>DNS را وارد کنید (DNS دوم اختیاری است)</label>
    <div class="inputs">
      <input id="p" placeholder="DNS پرایمری (مثلاً 8.8.8.8 یا ۸.۸.۸.۸)">
      <input id="s" placeholder="DNS سکندری (اختیاری)">
    </div>
    <div class="helper">
      اگر فقط یکی وارد شود، همان تست می‌شود. اگر هر دو وارد شوند، جداگانه بررسی می‌شوند.
    </div>

    <button id="btn">شروع تست</button>

    <div class="progress"><i id="bar"></i></div>

    <div class="error" id="err"></div>

    <div class="grid" id="grid">
      <div class="box">
        <div class="boxHead">
          <div class="boxTitle">🎮 سرورهای Xbox</div>
          <div class="state">آماده</div>
        </div>
        <button class="toggle">جزئیات بیشتر</button>
        <div class="details">پس از تست نمایش داده می‌شود.</div>
      </div>

      <div class="box">
        <div class="boxHead">
          <div class="boxTitle">🎮 سرورهای PlayStation</div>
          <div class="state">آماده</div>
        </div>
        <button class="toggle">جزئیات بیشتر</button>
        <div class="details">پس از تست نمایش داده می‌شود.</div>
      </div>
    </div>

    <div class="footer">
      این تست فقط بررسی می‌کند DNS بتواند دامنه‌های اصلی هر سرویس را Resolve کند.
    </div>

  </div>
</div>

<script>
document.querySelectorAll(".toggle").forEach(b=>{
  b.onclick=()=>{
    const box=b.closest(".box");
    box.classList.toggle("open");
    b.textContent=box.classList.contains("open")?"بستن جزئیات":"جزئیات بیشتر";
  }
});
</script>
</body>
</html>
